    - Jain (Novo Parity): datasets/jain/README.md
    - Harvey (Nanobodies): datasets/harvey/README.md
    - Shehata (PSR): datasets/shehata/README.md

  - Research:
    - Novo Parity Analysis: research/novo-parity.md
    - Methodology: research/methodology.md
    - Assay Thresholds: research/assay-thresholds.md
    - Benchmark Results: research/benchmark-results.md
    - Model Zoo Roadmap: research/model-zoo-roadmap.md

  - Developer Guide:
    - Architecture: developer-guide/architecture.md
    - Development Workflow: developer-guide/development-workflow.md
    - Testing Strategy: developer-guide/testing-strategy.md
    - CI/CD: developer-guide/ci-cd.md
    - Type Checking: developer-guide/type-checking.md
    - Security: developer-guide/security.md
    - Preprocessing Internals: developer-guide/preprocessing-internals.md
    - Docker: developer-guide/docker.md

  - API Reference:
    - Core:
      - Trainer: api/core/trainer.md
      - Embeddings: api/core/embeddings.md
      - Classifier: api/core/classifier.md
      - Prediction: api/core/prediction.md
    - Datasets:
      - Base: api/datasets/base.md
      - Boughter: api/datasets/boughter.md
      - Jain: api/datasets/jain.md
      - Harvey: api/datasets/harvey.md
      - Shehata: api/datasets/shehata.md
    - CLI:
      - Train: api/cli/train.md
      - Test: api/cli/test.md
      - Predict: api/cli/predict.md
      - Preprocess: api/cli/preprocess.md
      - App (Gradio): api/cli/app.md

  - Archive:
    - Migrations: archive/migrations/
    - Investigations: archive/investigations/
    - Plans: archive/plans/

# Extra CSS/JS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Social links
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/The-Obstacle-Is-The-Way/antibody_training_pipeline_ESM
  version:
    provider: mike
