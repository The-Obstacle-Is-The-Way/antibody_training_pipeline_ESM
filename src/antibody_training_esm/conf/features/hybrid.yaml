# Hybrid feature extraction (ESM + Biophysical descriptors)
# Produces 1283-dimensional feature vector: ESM (1280) + Biophysical (3)
#
# Biophysical descriptors (from Sakhnini et al. 2025 Table S1):
#   - Charge at pH 6.0 (#21)
#   - Charge at pH 7.4 (#22)
#   - Theoretical pI (#66)
#
# NOTE: Novo Nordisk paper does NOT use StandardScaler for either ESM or biophysical
# features. We match their methodology exactly - no scaling applied.
#
# Usage: uv run antibody-train features=hybrid
use_biophysical: true
