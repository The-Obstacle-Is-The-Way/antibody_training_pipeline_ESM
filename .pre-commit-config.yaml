repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - pandas-stubs
          - types-PyYAML
          - pydantic>=2.10.0
          - numpy
          - jinja2
        exclude: ^(experiments/|reference_repos/|tests/unit/cli/test_train\.py)
